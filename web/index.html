<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科原健康 · AI 健康顾问</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f4f0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #2e7d4f; color: #fff; padding: 14px 20px; font-size: 17px; font-weight: 600; }
  header small { font-weight: 400; opacity: .8; margin-left: 8px; font-size: 12px; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 14px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.7; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .user .bubble { background: #2e7d4f; color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: #fff; border: 1px solid #e2e8e2; border-bottom-left-radius: 4px; }
  .sources { margin-top: 8px; font-size: 12px; color: #6b7d6f; border-top: 1px dashed #d8e2d8; padding-top: 6px; }
  .sources summary { cursor: pointer; }
  .sources .src { margin-top: 4px; padding: 6px 8px; background: #f6faf6; border-radius: 6px; }
  #inputbar { padding: 12px 16px; background: #fff; border-top: 1px solid #e2e8e2; }
  #inputbar .wrap { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  #q { flex: 1; padding: 11px 14px; border: 1px solid #cfdccf; border-radius: 10px; font-size: 15px; outline: none; }
  #q:focus { border-color: #2e7d4f; }
  button { padding: 0 20px; background: #2e7d4f; color: #fff; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; }
  button:disabled { background: #9cb8a5; cursor: not-allowed; }
  .hint { max-width: 760px; margin: 0 auto; padding: 4px 16px 10px; font-size: 12px; color: #8a9a8d; }
</style>
</head>
<body>
<header>科原健康 · AI 健康顾问<small>基于公司知识库的 RAG 智能客服（演示）</small>
  <button id="newchat" style="float:right;background:#256842;color:#fff;padding:4px 12px;font-size:12px;border-radius:6px;margin-top:2px;">新会话</button>
</header>
<div id="chat"></div>
<div class="hint">试试问：糖尿病人能吃红薯吗？/ 高血压饮食要注意什么？/ 课程能退款吗？</div>
<div id="inputbar">
  <div class="wrap">
    <input id="q" placeholder="请输入您的健康问题…" autocomplete="off">
    <button id="send">发送</button>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const q = document.getElementById('q');
const sendBtn = document.getElementById('send');

// 多轮会话：session_id 持久化在 localStorage，点"新会话"重新生成
let sessionId = localStorage.getItem('ky_session_id');
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem('ky_session_id', sessionId);
}
document.getElementById('newchat').onclick = () => {
  sessionId = crypto.randomUUID();
  localStorage.setItem('ky_session_id', sessionId);
  chat.innerHTML = '';
  addMsg('bot', '已开始新会话，之前的对话上下文已清空。');
};

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="bubble"></div>`;
  div.querySelector('.bubble').textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div.querySelector('.bubble');
}

function addSources(bubble, sources) {
  if (!sources || !sources.length) return;
  const det = document.createElement('details');
  det.className = 'sources';
  det.innerHTML = `<summary>📚 引用 ${sources.length} 条知识库资料</summary>` +
    sources.map(s => `<div class="src"><b>${s.source}</b>（相关度 ${(s.score*100).toFixed(1)}%）<br>${s.content.slice(0, 80)}…</div>`).join('');
  bubble.appendChild(det);
  chat.scrollTop = chat.scrollHeight;
}

async function ask() {
  const question = q.value.trim();
  if (!question) return;
  q.value = '';
  sendBtn.disabled = true;
  addMsg('user', question);
  const bubble = addMsg('bot', '…');

  try {
    const resp = await fetch('/api/v1/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, session_id: sessionId })
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', curEvent = '', answer = '', sources = [];
    bubble.textContent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (line.startsWith('event:')) { curEvent = line.slice(6).trim(); continue; }
        if (!line.startsWith('data:')) continue;
        const data = JSON.parse(line.slice(5));
        if (curEvent === 'token') { answer += data.token; bubble.textContent = answer; }
        else if (curEvent === 'sources') { sources = data; }
        else if (curEvent === 'error') { bubble.textContent = '⚠️ ' + data.message; }
        chat.scrollTop = chat.scrollHeight;
      }
    }
    if (!answer && !bubble.textContent) bubble.textContent = '（无响应）';
    addSources(bubble, sources);
  } catch (e) {
    bubble.textContent = '⚠️ 请求失败：' + e.message;
  }
  sendBtn.disabled = false;
  q.focus();
}

sendBtn.onclick = ask;
q.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
